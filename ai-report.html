<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI분석리포트 · 강북구 스마트팜 재배단지</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:;base64,=">
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
</head>
<body>
  <!-- ✅ 공통 레이아웃 (사이드바, 헤더, 오버레이는 common.js에서 자동 주입) -->
  <div class="app-layout">
    <div class="right-column">
      <main class="content-wrapper">
        <div class="container" id="adminArea" style="display:none;">
          <div class="page-top-bar" style="margin-bottom:12px;">
            <h2 style="margin:0 0 4px 0; font-size:14px;">🤖 AI분석리포트</h2>
            <p style="margin:0; font-size:10.5px; color:#666;">최대 3개의 AI 결과를 비교하고, 과거 분석결과도 확인하세요.</p>
          </div>

          <div class="daily-input-box">
            <div class="date-row">
              <span></span>
              <input type="date" id="sDate">
              <span>~</span>
              <input type="date" id="eDate">
              <select id="datePreset" onchange="setPreset()">
                <option value="weekday">이번 주(월~금)</option>
                <option value="week">이번 주(월~일)</option>
                <option value="month">이번 달</option>
                <option value="month3">최근 3개월</option>
                <option value="custom">직접입력</option>
              </select>
            </div>
            <div class="info-row">
              <span>📊 측정기록건수: <strong id="totalCount">0</strong></span>
              <span>📍 측정양액급수라인: <strong id="lineInfo">-</strong></span>
              <span>📏 급액시즌기준: <strong id="stdInfo">-</strong></span>
            </div>
          </div>

          <!-- ✅ 분석 실행 영역 -->
          <div class="card" id="aiSelectArea">
            <h3>🤖 분석할 AI 선택 (최대 3개)</h3>
            <div class="ai-check-box" id="aiCheckList">
              <div style="color:#888;">AI 목록을 불러오는 중...</div>
            </div>

            <!-- ✅ 사전 지시사항 -->
            <div style="margin-top:12px; margin-bottom:8px;">
              <label style="display:block; font-size:10.5px; font-weight:600; color:#4A7C59; margin-bottom:4px;">
                💬 사전 지시사항 (선택)
              </label>
              <textarea id="preInstructions"
                style="width:100%; height:55px; padding:7px 9px; font-size:11px; font-family:inherit; border:1px solid #c9c3ac; border-radius:6px; resize:vertical; background:#fff;"
                placeholder="예: 3번라인 관수 부족 의심, 최근 흐린날 영향 분석, 경고구역 원인 심층 분석 등"></textarea>
            </div>

            <div style="margin-top:8px;">
              <button onclick="runAIAnalysis()" class="btn primary" id="runAnalysisBtn">✅ 선택한 AI로 분석 실행</button>
            </div>
          </div>

          <div class="card" id="noPermitArea" style="display:none;">
            <div class="disabled-box">ⓘ 분석 실행 권한이 없습니다. 관리자에게 문의하세요.</div>
          </div>

          <div class="card">
            <h3>📋 분석결과</h3>
            <div id="aiResultArea">
              <div style="color:#888; padding:16px; text-align:center; font-size:11px;">
                분석할 AI를 선택하고 [분석 실행] 버튼을 클릭하세요.
              </div>
            </div>
          </div>

          <div class="card">
            <h3>📚 과거 분석결과</h3>
            <div class="past-list" id="pastResultArea">
              <div style="color:#888; padding:12px; text-align:center; font-size:11px;">불러오는 중...</div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="resultModal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h4 id="modalTitle">AI분석 결과</h4>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-body" id="modalBody">내용 불러오는 중...</div>
    </div>
  </div>

  <script src="common.js" defer></script>
  <script src="assets/js/pages/ai-report.js" defer></script>
</body>
</html>
