<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강북구 스마트팜 재배단지</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:;base64,=">
</head>
<body>
  <!-- ✅ 공통 레이아웃 (사이드바, 헤더, 오버레이는 common.js에서 자동 주입) -->
  <div class="app-layout">
    <div class="right-column">
      <main class="content-wrapper">
        <div class="container" id="adminArea" style="display:none;">
          <!-- ✅ 농장정보 카드 -->
          <div id="farmInfoArea" class="card" style="background: #f8f9fa; gap:8px; border: 1px solid #5fa05f; border-radius:8px; margin-bottom: 12px;">
            농장정보 불러오는 중...
          </div>

          <!-- ✅ 오늘의 배액 현황 -->
          <div class="card">
            <h3>📊 오늘의 배액 현황</h3>
            <div id="statsBox" style="display:flex; gap:8px; text-align:center; flex-wrap:nowrap;">
              <div style="flex:1; min-width:0; padding:10px 4px; background:#e3f2fd; border-radius:6px;">
                <div style="font-size:18px; font-weight:bold; color:#1565c0;" id="todayCount">0건</div>
                <div style="font-size:10px; color:#666; margin-top:2px;">오늘 측정건수</div>
              </div>
              <div style="flex:1; min-width:0; padding:10px 4px; background:#e8f5e9; border-radius:6px;">
                <div style="font-size:18px; font-weight:bold; color:#2e7d32;" id="avgEc">-</div>
                <div style="font-size:10px; color:#666; margin-top:2px;">평균 EC</div>
              </div>
              <div style="flex:1; min-width:0; padding:10px 4px; background:#fff3e0; border-radius:6px;">
                <div style="font-size:18px; font-weight:bold; color:#ef6c00;" id="avgPh">-</div>
                <div style="font-size:10px; color:#666; margin-top:2px;">평균 pH</div>
              </div>
              <div style="flex:1; min-width:0; padding:10px 4px; background:#fce4ec; border-radius:6px;">
                <div style="font-size:18px; font-weight:bold; color:#c62828;" id="avgTemp">-</div>
                <div style="font-size:10px; color:#666; margin-top:2px;">평균 온도</div>
              </div>
            </div>
          </div>

          <!-- ✅ 최근 7일 배액율 현황 카드 -->
          <div class="card">
            <h3>💧 최근 7일 배액율 현황 (목표 대비)</h3>
            <div class="grid-4" style="margin-top:10px;">
              <div class="stat-card">
                <div class="label">평균 배액율</div>
                <div class="value" id="avgRatio" style="color:#1565c0;">-</div>
              </div>
              <div class="stat-card">
                <div class="label">정상(±10%)</div>
                <div class="value" id="ratioOk" style="color:#2e7d32;">0건</div>
              </div>
              <div class="stat-card warn">
                <div class="label">주의(±20%)</div>
                <div class="value" id="ratioWarn" style="color:#ef6c00;">0건</div>
              </div>
              <div class="stat-card" style="background:#ffebee; border-color:#ffcdd2;">
                <div class="label">경고(초과)</div>
                <div class="value" id="ratioDanger" style="color:#c62828;">0건</div>
              </div>
            </div>
          </div>

          <!-- ✅ 최근 추이 -->
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <h3 style="margin:0;">📈 최근 5일 EC 추이</h3>
              <div style="display:flex; gap:6px;">
                <button data-line="V01" id="btnV01" style="padding:4px 10px; font-size:11px; border:1px solid #1976d2; border-radius:4px; background:#e3f2fd; color:#0d47a1; font-weight:bold; cursor:pointer;">V01</button>
                <button data-line="V02" id="btnV02" style="padding:4px 10px; font-size:11px; border:1px solid #ccc; border-radius:4px; background:#fff; color:#333; cursor:pointer;">V02</button>
                <button data-line="V03" id="btnV03" style="padding:4px 10px; font-size:11px; border:1px solid #ccc; border-radius:4px; background:#fff; color:#333; cursor:pointer;">V03</button>
              </div>
            </div>
            <div id="trendArea" style="margin-top:8px;">불러오는 중...</div>
          </div>

          <!-- ✅ 구역별 최신 상태 -->
          <div class="card">
            <h3>📍 구역별 최신 상태</h3>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>구역명</th>
                    <th>최신측정일시</th>
                    <th>최근 배액EC</th>
                    <th>최근 배액pH</th>
                    <th>상태</th>
                  </tr>
                </thead>
                <tbody id="zoneStatus">
                  <tr><td colspan="5" class="empty-box">데이터를 불러오는 중입니다...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="common.js" defer></script>
  <script src="assets/js/pages/dashboard.js" defer></script>
</body>
</html>
