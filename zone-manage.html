<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구역등록 · 강북구 스마트팜 재배단지</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:;base64,=">
</head>
<body>
  <!-- ✅ 공통 레이아웃 (사이드바, 헤더, 오버레이는 common.js에서 자동 주입) -->
  <div class="app-layout">
    <div class="right-column">
      <main class="content-wrapper">
        <div class="container" id="adminArea" style="display:none;">
          <div class="page-top-bar">
            <h2>📍 구역 관리</h2>
            <p>재배 구역을 등록하고 관리합니다.</p>
          </div>

          <!-- ✅ 구역 등록 -->
          <div class="card daily-input-box">
            <h3 id="formTitle">➕ 구역 등록</h3>
            <input type="hidden" id="editId">
            <div class="form-grid zone-form">
              <label>구역명 *</label><input type="text" id="zoneName" placeholder="예: 1구역, 1번라인">
              <label>양액라인</label>
              <select id="line">
                <option value="V01" selected>V01</option>
                <option value="V02">V02</option>
                <option value="V03">V03</option>
                <option value="V04">V04</option>
                <option value="V05">V05</option>
              </select>
              <label class="checkbox-wrap"><input type="checkbox" id="hasSampleData"> 샘플/배액량</label>
              <label>비고</label>
              <textarea id="remark" class="full" placeholder="위치, 면적 등 참고사항"></textarea>
            </div>
            <div class="form-btn-row">
              <button class="btn-secondary" onclick="resetForm()">↺ 초기화</button>
              <button class="btn-primary" onclick="saveZone()">💾 저장</button>
            </div>
          </div>

          <!-- ✅ 구역 목록 -->
          <div class="card">
            <h3>📍 등록 구역 목록</h3>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>구역명</th>
                    <th>양액라인</th>
                    <th>샘플/배액량</th>
                    <th>비고</th>
                    <th>관리</th>
                  </tr>
                </thead>
                <tbody id="listBody">
                  <tr><td colspan="5" class="empty-box">데이터를 불러오는 중입니다...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="common.js" defer></script>
  <script src="assets/js/pages/zone-manage.js" defer></script>
</body>
</html>
