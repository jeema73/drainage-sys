<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배액기록 · 강북구 스마트팜 재배단지</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:;base64,=">
</head>
<body>
  <!-- ✅ 공통 레이아웃 (사이드바, 헤더, 오버레이는 common.js에서 자동 주입) -->
  <div class="app-layout">
    <div class="right-column">
      <main class="content-wrapper">
        <div class="container" id="adminArea" style="display:none;">
          <div class="page-top-bar" style="margin-bottom:12px;">
            <h2 style="margin:0 0 4px 0; font-size:14px;">📝 배액 기록 관리</h2>
            <p style="margin:0; font-size:10.5px; color:#666;">배액 EC/pH 데이터를 등록하고 관리·승인할 수 있습니다.</p>
          </div>

          <div class="card daily-input-box" id="recordFormCard">
            <h3 id="formTitle">➕ 배액 기록 등록</h3>
            <input type="hidden" id="editId">
            <div class="form-grid">
              <label>측정일자 *</label><input type="date" id="measureDate">
              <label>측정시간 *</label><input type="time" id="measureTime">
              <label>구역명 *</label><select id="zoneSel"><option value="">-- 구역 선택 --</option></select>
              <label>배지온도(℃)</label><input type="number" step="0.1" id="bedTemp" inputmode="decimal" pattern="[0-9]*\.?[0-9]*">
              <label>배액 EC *</label><input type="number" step="0.01" id="drainEc" inputmode="decimal" pattern="[0-9]*\.?[0-9]*">
              <label>배액 pH *</label><input type="number" step="0.01" id="drainPh" inputmode="decimal" pattern="[0-9]*\.?[0-9]*">
            </div>
            <div id="sampleRowWrap" style="display:none;">
              <div style="font-size:10.5px; font-weight:700; color:#4A7C59; margin-bottom:8px;">
                🧪 샘플 측정 · 배액량 · 전일 공급횟수
              </div>
              <div class="form-grid">
                <label>샘플 EC</label><input type="number" step="0.01" id="sampleEc" inputmode="decimal" pattern="[0-9]*\.?[0-9]*">
                <label>샘플 pH</label><input type="number" step="0.01" id="samplePh" inputmode="decimal" pattern="[0-9]*\.?[0-9]*">
                <label>배액량(mL)</label><input type="number" id="drainAmount" inputmode="numeric" pattern="[0-9]*" placeholder="예: 800">
                <label>전일 공급횟수(회) *</label><input type="number" step="1" id="supplyEvents" inputmode="numeric" pattern="[0-9]*" placeholder="어제 총 급수횟수 (예: 8)">     
              </div>
              <!-- 💧 실시간 배액율 계산 안내 바 -->
              <div id="realtimeRatioInfo" style="display:none; margin-top:8px; padding:6px 10px; background:#e8f5e9; border:1px solid #c8e6c9; border-radius:6px; font-size:10.5px; color:#2e7d32; line-height:1.4;">
              </div>
            </div>
            <div class="form-btn-row">
              <button type="button" id="saveBtn" class="btn-primary">💾 저장</button>
              <button type="button" id="resetBtn" class="btn-secondary">↺ 초기화</button>
            </div>
          </div>

          <!-- ✅ 조회 조건 -->
          <div class="card">
            <h3>🔍 조회</h3>
            <div class="form-row search-row">
              <div><label>시작일</label><input type="date" id="sDate"></div>
              <div><label>종료일</label><input type="date" id="eDate"></div>
              <div><label>구역</label>
                <select id="zFilter">
                  <option value="">전체</option>
                </select>
              </div>
              <div><label>승인상태</label>
                <select id="approvedFilter">
                  <option value="">전체</option>
                  <option value="false">미승인</option>
                  <option value="true">승인완료</option>
                </select>
              </div>
            </div>
          </div>

          <!-- ✅ 기록 목록 -->
          <div class="card">
            <h3>📋 기록목록</h3>
            <div class="table-wrapper">
              <table style="min-width:1000px; width:100%;">
                <thead>
                  <tr>
                    <th style="min-width:70px;">일자</th>
                    <th style="min-width:40px;">시간</th>
                    <th style="min-width:110px;">구역/라인</th>
                    <th style="min-width:60px;">배액EC</th>
                    <th style="min-width:60px;">기준EC</th>
                    <th style="min-width:60px;">EC편차</th>
                    <th style="min-width:60px;">배액pH</th>
                    <th style="min-width:60px;">기준pH</th>
                    <th style="min-width:60px;">pH편차</th>
                    <th style="min-width:55px;">샘플EC</th>
                    <th style="min-width:55px;">샘플pH</th>
                    <th style="min-width:55px;">배지온도</th>
                    <th style="min-width:70px;">배액량<br><span style="font-size:9px;color:#888;">(전일 공급횟수)</span></th>
                    <th style="min-width:60px;">배액율</th>
                    <th style="min-width:60px;">상태</th>
                    <th style="min-width:160px;">관리</th>
                  </tr>
                </thead>
                <tbody id="listBody">
                  <tr><td colspan="16" class="empty-box">조회 버튼을 누르세요.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="common.js" defer></script>
  <script src="assets/js/pages/drain-record.js" defer></script>
</body>
</html>
