<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계정관리 · 강북구 스마트팜 재배단지</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:;base64,=">
</head>
<body>
  <!-- ✅ 공통 레이아웃 (사이드바, 헤더, 오버레이는 common.js에서 자동 주입) -->
  <div class="app-layout">
    <div class="right-column">
      <main class="content-wrapper">
        <div class="container" id="adminArea" style="display:none;">
          <div class="page-top-bar">
            <h2>👤 계정 관리</h2>
            <p>최고관리자 전용 — 사용자 계정을 생성하고 관리합니다.</p>
          </div>

          <div class="card daily-input-box">
            <h3 id="formTitle">➕ 계정 등록</h3>
            <input type="hidden" id="editId">
            <div class="form-grid">
              <label>아이디 *</label><input type="text" id="userId" placeholder="로그인 아이디">
              <label>비밀번호 *</label><input type="password" id="userPw" placeholder="4자 이상">
              <label>사용자명 *</label><input type="text" id="userName" placeholder="예: 홍길동">
              <label>계정 종류 *</label><select id="userRole"><option value="admin">최고관리자</option><option value="manager">매니저</option><option value="worker">공공근로자</option><option value="guest">게스트</option></select>
              <label>기타사항</label><input type="text" id="userNote" class="full" placeholder="비고, 연락처 등">
            </div>
            <div class="form-btn-row">
              <button class="btn-primary" onclick="saveAccount()">💾 저장</button>
              <button class="btn-secondary" onclick="resetForm()">↺ 초기화</button>
            </div>
          </div>

          <!-- ✅ 계정 목록 -->
          <div class="card">
            <h3>📋 등록 계정 목록</h3>
            <table>
              <thead>
                <tr>
                  <th>아이디</th>
                  <th>사용자이름</th>
                  <th>권한</th>
                  <th>기타사항</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody id="listBody">
                <tr><td colspan="5" class="empty-box">데이터를 불러오는 중입니다...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- ✅ 권한 없을 때 -->
        <div class="container" id="deniedArea" style="display:none;">
          <div class="card access-denied">
            <h3>🔒 접근 권한이 없습니다</h3>
            <p>이 페이지는 최고관리자만 접근할 수 있습니다.</p>
            <button class="btn-primary" onclick="location.href='dashboard.html'">대시보드로 돌아가기</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="common.js" defer></script>
  <script src="assets/js/pages/account-manage.js" defer></script>
</body>
</html>
