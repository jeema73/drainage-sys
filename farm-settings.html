<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>농장설정 · 강북구 스마트팜 재배단지</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:;base64,=">
</head>
<body>
  <!-- ✅ 공통 레이아웃 (사이드바, 헤더, 오버레이는 common.js에서 자동 주입) -->
  <div class="app-layout">
    <div class="right-column">
      <main class="content-wrapper">
        <div class="container" id="adminArea" style="display:none;">
          <div class="page-top-bar">
            <h2>🏠 농장 기본 설정</h2>
            <p>정식일과 시즌 종료일은 대시보드의 경과일·생육단계·진행률 계산에 사용됩니다.</p>
          </div>
          <!-- ✅ 입력 폼 -->
          <div class="card daily-input-box">
            <h3>📋 농장 정보 입력</h3>
            <div class="season-note">
              💡 <strong>다음 작기·작물 시</strong><br> → 시즌명, 정식일, 종료일, 품종만 변경해서 저장하면 됩니다. 
              기존 기록은 시즌별로 보존됩니다.
            </div>
            <div class="form-grid">
              <label><span style="color:red">*</span>농장명</label>
              <input type="text" id="farmName" placeholder="강북구 스마트팜">
              
              <label>소재지(동)</label>
              <select id="farmDong">
                <option value="수유동">수유동</option>
                <option value="번동">번동</option>
                <option value="미아동">미아동</option>
                <option value="우이동">우이동</option>
                <option value="삼양동">삼양동</option>
                <option value="송중동">송중동</option>
                <option value="송천동">송천동</option>
                <option value="인수동">인수동</option>
              </select>

              <label>상세주소</label>
              <input type="text" id="farmAddr" placeholder="서울시 강북구...">
              
              <label><span style="color:red">*</span>시즌명</label>
              <input type="text" id="season" placeholder="2026-금실딸기">
              
              <label>관리자명</label>
              <input type="text" id="managerName" placeholder="홍길동">
              
              <label>연락처</label>
              <input type="text" id="contact" placeholder="010-1234-5678">
              
              <label>재배작물</label>
              <input type="text" id="cropName" value="딸기">
              
              <label>품종</label>
              <input type="text" id="variety" placeholder="금실">
              
              <label><span style="color:red">*</span>정식일</label>
              <input type="date" id="plantingDate">
              
              <label><span style="color:red">*</span>시즌 종료일</label>
              <input type="date" id="seasonEndDate">
            </div>
            <div class="form-btn-row">
              <button onclick="saveFarmSettings()" class="btn-primary">💾 저장</button>
              <button onclick="loadFarmSettings()" class="btn-primary">🔄 불러오기</button>
              <button onclick="clearForm()" class="btn-secondary">🔄 새로작성</button>
            </div>
          </div>
          <!-- ✅ 미리보기 -->
          <div class="card">
            <h3>ℹ️ 미리보기</h3>
            <div class="form-grid" style="color:#444;">
              <label>정식후 경과일</label>
              <input type="text" id="previewDays" class="readonly-bg" readonly>
              <label>현재 생육단계</label>
              <input type="text" id="previewStage" class="readonly-bg" readonly>
              <label>시즌 진행률</label>
              <input type="text" id="previewRate" class="readonly-bg" readonly>
            </div>
          </div>
          <!-- ✅ 저장된 시즌 설정 리스트 -->
          <div class="card">
            <h3>📚 저장된 시즌 설정</h3>
            <table class="saved-list">
              <thead>
                <tr>
                  <th style="width:18%;">시즌명</th>
                  <th style="width:10%;">작물</th>
                  <th style="width:10%;">품종</th>
                  <th style="width:10%;">정식일</th>
                  <th style="width:10%;">종료일</th>
                  <th style="width:14%;">최종수정</th>
                  <th style="width:26%;">작업</th>
                </tr>
              </thead>
              <tbody id="savedListBody">
                <tr><td colspan="7" class="empty-row">불러오는 중...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <!-- ✅ 권한 제한 영역 -->
        <div class="container" id="noPermitArea" style="display:none;">
          <div class="card access-denied">
            <h3>🔒 접근 권한이 없습니다</h3>
            <p>농장설정은 최고관리자와 매니저만 접근할 수 있습니다.</p>
            <button class="btn-primary" onclick="location.href='dashboard.html'">대시보드로 돌아가기</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="common.js" defer></script>
  <script src="assets/js/pages/farm-settings.js" defer></script>
</body>
</html>
