<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인쇄/CSV · 강북구 스마트팜 재배단지</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:;base64,=">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <!-- ✅ 공통 레이아웃 (사이드바, 헤더, 오버레이는 common.js에서 자동 주입) -->
  <div class="app-layout">
    <div class="right-column">
      <main class="content-wrapper">
        <div class="container" id="adminArea" style="display:none;">
          <div class="page-top-bar">
            <div>
              <h2 style="font-size:18px; margin:4px 0; color:#033f1c;">🖨️ 측정 기록 인쇄</h2>
              <p style="font-size:11px; margin:2px 0;">날짜를 지정하고 조회 후 인쇄 또는 엑셀/CSV로 내보낼 수 있습니다.</p>
            </div>
          </div>
          <div class="daily-input-box">
            <label style="font-size:11px;"></label>
            <input type="date" id="sDate">
            <label style="font-size:11px;">~</label>
            <input type="date" id="eDate">
            <button class="btn primary" onclick="loadData()">🔍 조회</button><br><br>
            <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content: right;">
              <button class="btn-excel" onclick="exportExcel()" style="background:#1d6f42; color:#fff; border:none; padding:5px 12px; font-size:11px; border-radius:4px; cursor:pointer;">📗 엑셀(XLSX) 다운로드</button>
              <button class="btn-csv" onclick="exportCSV()">📥 CSV 다운로드</button>
              <button class="btn-print" onclick="window.print()">🖨️ 인쇄하기</button>
            </div>
          </div>
          <!-- ✅ 제목/기간/표만 인쇄될 영역 -->
          <div class="table-container">
            <div id="printArea" style="display:none;">
              <div style="text-align:left; margin-bottom:10px;">
                <h3 style="margin:4px 0; font-size:24px; color:#31425a;">딸기 배액 측정 기록표</h3>
                <label style="margin:2px 0; font-size:13px; color:#313d49;" id="periodInfo"></label>
                <label style="margin:2px 0; font-size:10px; color:#666;">· 측정기준: EC·pH·온도/배액량</label>
              </div>
              <table id="printTable"></table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="common.js" defer></script>
  <script src="assets/js/pages/print-page.js" defer></script>
</body>
</html>
