<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인쇄/CSV · 강북구 스마트팜 재배단지</title>
  <link rel="stylesheet" href="style.css?v=20260919">
  <link rel="icon" href="data:;base64,=">
</head>
<body>
  <!-- ✅ 통일된 전체 레이아웃 — AI설정과 완전 동일 -->
  <div class="app-layout">
    <!-- ✅ 왼쪽 사이드바 — AI설정과 완전 동일 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo-top">
        <img src="https://www.gangbuk.go.kr/static/images/portal/ns_bi_logo1.png" alt="강북구 로고">
      </div>
      <!-- ✅ 사용자 정보 박스 — AI설정과 완전 동일 -->
      <!-- ✅ 사용자 정보 박스 -->
      <div class="user-info-box" id="userInfoBox">
        <div class="sys-name1">Drainage System</div>
        <div class="sys-name">배액 관리 시스템</div>
        <div class="user-row">
          <span class="user-name" id="sidebarUserName">사용자 정보</span>
          <a href="#" class="logout-btn" id="sidebarLogoutBtn">LOGOUT</a>
        </div>
      </div>
      <div class="menu-divider"></div>
      <!-- ✅ 메뉴 — 권한별 보임/숨김, AI설정과 완전 동일 -->
      <div class="sidebar-menu" id="sidebarMenu">
        <a href="dashboard.html" data-role="all">📊 대시보드</a>
        <a href="drain-record.html" data-role="all">📝 배액기록</a>
        <a href="analysis-report.html" data-role="all">📈 분석리포트</a>
        <a href="ai-report.html" data-role="all">🤖 AI분석리포트</a>
        <a href="print-page.html" data-role="all">🖨️ 인쇄/CSV</a>
        <div class="menu-divider"></div>
        <a href="supply-standard.html" data-role="admin,manager">⚙️ 급액기준등록</a>
        <a href="zone-manage.html" data-role="admin,manager">📍 구역등록</a>
        <a href="farm-settings.html" data-role="admin,manager">🏠 농장설정</a>
        <a href="ai-settings.html" data-role="admin">🔧 AI분석설정</a>
        <a href="account-manage.html" class="active" data-role="admin">👤 계정관리</a>
      </div>
      <!-- ✅ 구분선 -->
      <div class="menu-divider"></div>
      <!-- ✅ 하단 로고 — AI설정과 완전 동일 -->
      <div class="sidebar-logo-bottom">
        <img src="https://www.gangbuk.go.kr/static/images/portal/ns_bi_logo1_eng.png" alt="하단로고">
      </div>
      <!-- ✅ 날씨 영역 — AI설정과 완전 동일 -->
      <div class="weather-box" id="weatherBox">
        <table class="weather-table">
          <tr>
            <td style="width: 35%;">
              <div class="weather-icon" id="weatherIcon">🌤️</div>
            </td>
            <td style="width: 65%; text-align: left; padding-left: 8px;">
              <div class="weather-temp" id="weatherTemp">--°</div>
              <div class="weather-desc" id="weatherDesc">날씨 불러오는 중...</div>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <div class="weather-range" id="weatherRange">최저 --° / 최고 --°</div>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <div class="weather-location">서울시 강북구</div>
            </td>
          </tr>
        </table>
      </div>
      <div style="margin-top:auto;"></div>
    </aside>
    <!-- ✅ 오른쪽: TOP바 + 내용 -->
    <div class="right-column">
      <header class="top-header">
        <button class="header-hamburger" id="hamBtn">☰</button>
        <div class="header-title-group">
          <div class="header-title" id="topFarmName">농장정보 로딩중...</div>
          <div class="top-meta" id="topFarmMeta">정보 불러오는 중...</div>
        </div>
      </header>
      <!-- ✅ 내용 — 기존 인쇄/CSV 기능 그대로 유지 -->
      <main class="content-wrapper">
        <div class="container" id="adminArea" style="display:none;">
          <div class="page-top-bar">
            <div>
              <h2 style="font-size:18px; margin:4px 0; color:#033f1c;">🖨️ 측정 기록 인쇄</h2>
              <p style="font-size:11px; margin:2px 0;">날짜를 지정하고 조회 후 인쇄 또는 CSV로 내보낼 수 있습니다.</p>
            </div>
          </div>
          <div class="daily-input-box">
            <label style="font-size:11px;">시작일:</label>
            <input type="date" id="sDate">
            <label style="font-size:11px;">종료일:</label>
            <input type="date" id="eDate">
            <button class="btn primary" onclick="loadData()">🔍 조회</button><br><br>
            <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content: right;">
              <button class="btn-csv" onclick="exportCSV()">📥 CSV 다운로드</button>
              <button class="btn-print" onclick="window.print()">🖨️ 인쇄하기</button>
            </div>
          </div>
          <!-- ✅ 제목/기간/표만 인쇄될 영역 -->
          <div class="table-container">
            <div id="printArea" style="display:none;">
              <div style="text-align:left; margin-bottom:10px;">
                <h3 style="margin:4px 0; font-size:24px; color:#31425a;">딸기 배액 측정 기록표</h3>
                <label style="margin:2px 0; font-size:13px; color:#313d49;" id="periodInfo"></label>
                <label style="margin:2px 0; font-size:10px; color:#666;">· 측정기준: EC·pH·온도/배액량</label>
              </div>
              <table id="printTable"></table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="overlay" id="overlay"></div>
   <script src="common.js?v=20260919" defer></script>
   <script src="assets/js/pages/print-page.js?v=20260919" defer></script>
</body>
</html>
